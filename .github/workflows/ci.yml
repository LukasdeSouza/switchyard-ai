name: CI - Tests & Coverage

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

jobs:
  test:
    name: Go Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: |
          set -o pipefail
          go test ./... \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -v \
            -timeout 180s \
            2>&1 | tee test-output.txt
          echo "TEST_EXIT_CODE=$?" >> $GITHUB_ENV

      - name: Generate coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            TOTAL_COV=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
            echo "TOTAL_COVERAGE=$TOTAL_COV" >> $GITHUB_ENV
            go tool cover -func=coverage.out > coverage-summary.txt
          else
            echo "TOTAL_COVERAGE=N/A" >> $GITHUB_ENV
            echo "No coverage file generated" > coverage-summary.txt
          fi
          cat coverage-summary.txt

      - name: Parse test results
        if: always()
        id: results
        run: |
          PASS=0
          FAIL=0
          SKIP=0
          if [ -f test-output.txt ]; then
            PASS=$(grep -c '^--- PASS:' test-output.txt || true)
            FAIL=$(grep -c '^--- FAIL:' test-output.txt || true)
            SKIP=$(grep -c '^--- SKIP:' test-output.txt || true)
          fi
          echo "pass=$PASS" >> $GITHUB_OUTPUT
          echo "fail=$FAIL" >> $GITHUB_OUTPUT
          echo "skip=$SKIP" >> $GITHUB_OUTPUT

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.existsSync('coverage-summary.txt') ? fs.readFileSync('coverage-summary.txt', 'utf8') : 'N/A';
            const pass = '${{ steps.results.outputs.pass }}';
            const fail = '${{ steps.results.outputs.fail }}';
            const skip = '${{ steps.results.outputs.skip }}';
            const totalCov = process.env.TOTAL_COVERAGE || 'N/A';
            const status = parseInt(fail) > 0 ? 'FAILED' : 'PASSED';

            // Parse per-package coverage
            const lines = summary.split('\n').filter(l => l.trim());
            const pkgLines = lines.filter(l => !l.includes('total:'));

            // Build package table
            let pkgRows = [];
            for (const line of pkgLines) {
              const parts = line.trim().split(/\s+/);
              if (parts.length >= 3) {
                const pkg = parts[0].replace('github.com/LukasdeSouza/nexus-ai-gateway/', '');
                const cov = parts[parts.length - 1];
                const covNum = parseFloat(cov);
                const tag = covNum >= 80 ? '[High]' : covNum >= 50 ? '[Med]' : '[Low]';
                pkgRows.push(`| \`${pkg}\` | ${tag} ${cov} |`);
              }
            }
            const pkgTable = pkgRows.length > 0
              ? ['| Package | Coverage |', '|---|---|', ...pkgRows].join('\n')
              : 'No package coverage details available.';

            const body = [
              '## Switchyard CI Report — Test Coverage',
              '',
              `- **Status:** **${status}**`,
              `- **Total Coverage:** \`${totalCov}\``,
              `- **Tests Summary:** ${pass} passed, ${fail} failed, ${skip} skipped`,
              '',
              '<details>',
              '<summary><strong>Coverage Breakdown by Package</strong></summary>',
              '',
              pkgTable,
              '',
              '</details>',
              '',
              '<details>',
              '<summary><strong>Raw Coverage Output</strong></summary>',
              '',
              '```text',
              summary,
              '```',
              '',
              '</details>',
              '',
              '---',
              `*Commit: \`${context.sha.substring(0, 7)}\`*`
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.body && c.body.includes('Switchyard CI Report — Test Coverage')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Add coverage to GitHub Actions Job Summary
        if: always()
        run: |
          echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Coverage:** \`${{ env.TOTAL_COVERAGE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Passed:** ${{ steps.results.outputs.pass }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Failed:** ${{ steps.results.outputs.fail }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage-summary.txt ]; then
            echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
            cat coverage-summary.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage-summary.txt
            test-output.txt
          retention-days: 30

      - name: Check test exit code
        if: steps.results.outputs.fail > 0 || env.TEST_EXIT_CODE != '0'
        run: |
          echo "Tests failed. Exit code: ${{ env.TEST_EXIT_CODE }}"
          exit 1
